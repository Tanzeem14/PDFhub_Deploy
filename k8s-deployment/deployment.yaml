# -------------------------------
# Namespace
# -------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: "2401067"

---
# -------------------------------
# Deployment
# -------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdfhub-deployment
  namespace: "2401067"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdfhub
  template:
    metadata:
      labels:
        app: pdfhub
    spec:
      imagePullSecrets:
        - name: nexus-secret

      containers:
        - name: pdfhub-container
          image: 127.0.0.1:30085/2401067/pdfhub:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          env:
            - name: PYTHONUNBUFFERED
              value: "1"

            - name: DJANGO_SETTINGS_MODULE
              value: "project.settings"

            - name: MONGO_URI
              value: "mongodb://pdfhub-mongo:27017"

            - name: GUNICORN_CMD_ARGS
              value: "--workers 1 --timeout 180"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 30

          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "1"
              memory: "4Gi"

---
# -------------------------------
# Service
# -------------------------------
apiVersion: v1
kind: Service
metadata:
  name: pdfhub-service
  namespace: "2401067"
spec:
  selector:
    app: pdfhub
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP

---
# -------------------------------
# Ingress (Fixed Static + Rewrite)
# -------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pdfhub-ingress
  namespace: "2401067"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    # Uncomment this when you add HTTPS:
    # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx

  # Uncomment when TLS is added
  # tls:
  #   - hosts:
  #       - 2401067.imcc.com
  #     secretName: tls-secret

  rules:
    - host: 2401067.imcc.com
      http:
        paths:
          # Main Django backend
          - path: /(.*)
            pathType: Prefix
            backend:
              service:
                name: pdfhub-service
                port:
                  number: 8000

          # Static files served by whitenoise
          - path: /static/(.*)
            pathType: Prefix
            backend:
              service:
                name: pdfhub-service
                port:
                  number: 8000
